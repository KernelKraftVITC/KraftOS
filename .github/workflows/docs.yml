name: Docs

on:
  schedule:
    - cron: "0 6 * * 2,5" # twice weekly, Tuesday + Friday 06:00 UTC — re-syncs submodules and redeploys
  workflow_dispatch:
  push:
    branches: [pages]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages
          submodules: recursive
          fetch-depth: 0

      - name: Pull latest commit from every submodule
        run: git submodule update --init --remote --recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - run: pip install -r requirements.txt

      - run: ./scripts/sync-docs.sh

      - run: mkdocs build --strict -d _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
